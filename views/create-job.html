<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a job | JobNest</title>
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/logo.svg">
</head>
<body data-page="create-job" data-access="recruiter">
  <header id="site-header"></header>
  <main>
    <section class="auth-card form-panel">
      <h1>Post a job</h1>
      <p class="muted">This listing will be linked to your recruiter account.</p>
      <div id="form-alert"></div>
      <form id="job-form">
        <label for="title">Job title</label>
        <input id="title" name="title" type="text">
        <p class="field-error" data-error-for="title"></p>
        <label for="company">Company</label>
        <input id="company" name="company" type="text">
        <p class="field-error" data-error-for="company"></p>
        <label for="location">Location</label>
        <input id="location" name="location" type="text">
        <p class="field-error" data-error-for="location"></p>
        <label for="salary">Annual salary (INR)</label>
        <input id="salary" name="salary" type="number" min="1">
        <p class="field-error" data-error-for="salary"></p>
        <label for="experience">Experience</label>
        <select id="experience" name="experience">
          <option value="">Select experience</option>
          <option value="0-1 years">0-1 years</option>
          <option value="1-3 years">1-3 years</option>
          <option value="2-4 years">2-4 years</option>
          <option value="3-5 years">3-5 years</option>
          <option value="5+ years">5+ years</option>
        </select>
        <p class="field-error" data-error-for="experience"></p>
        <label for="skills">Skills (comma-separated)</label>
        <input id="skills" name="skills" type="text" placeholder="JavaScript, HTML, CSS">
        <p class="field-error" data-error-for="skills"></p>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6"></textarea>
        <p class="field-error" data-error-for="description"></p>
        <button class="btn btn-primary" id="job-submit" type="submit">Publish job</button>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/dist/createJob.js"></script>
</body>
</html>
