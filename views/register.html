<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | HirePulse</title>
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/logo.svg">
</head>
<body data-page="register" data-access="guest">
  <header id="site-header"></header>
  <main>
    <section class="auth-card">
      <h1>Create your HirePulse account</h1>
      <p class="muted">Choose a role to get the right dashboard after registration.</p>
      <div id="form-alert"></div>
      <form id="register-form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text">
        <p class="field-error" data-error-for="name"></p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <p class="field-error" data-error-for="email"></p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password">
        <p class="field-error" data-error-for="password"></p>
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="">Select a role</option>
          <option value="candidate">Candidate</option>
          <option value="recruiter">Recruiter</option>
        </select>
        <p class="field-error" data-error-for="role"></p>
        <button class="btn btn-primary" id="register-submit" type="submit">Register</button>
      </form>
      <p>Already registered? <a href="./login.html">Login</a></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/dist/register.js"></script>
</body>
</html>
