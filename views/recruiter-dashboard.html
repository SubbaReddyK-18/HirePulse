<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter dashboard | JobNest</title>
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="icon" href="../assets/logo.svg">
</head>
<body data-page="recruiter-dashboard" data-access="recruiter">
  <header id="site-header"></header>
  <main>
    <section class="dash-hero">
      <div>
        <p class="eyebrow">Recruiter</p>
        <h1>Hello, <span id="welcome-name">there</span></h1>
        <p class="muted">Manage only the jobs you posted and update applicant status.</p>
      </div>
      <div class="quick-actions">
        <a class="btn btn-primary" href="./create-job.html">Post a job</a>
      </div>
    </section>
    <section class="stats-grid">
      <article class="stat-card">
        <p>Posted jobs</p>
        <strong id="jobs-count">0</strong>
      </article>
      <article class="stat-card">
        <p>Applications received</p>
        <strong id="applications-count">0</strong>
      </article>
      <article class="stat-card">
        <p>Workspace</p>
        <strong>Live</strong>
      </article>
    </section>
    <section>
      <div class="toolbar">
        <h2>Your job posts</h2>
      </div>
      <div id="jobs-list" class="jobs-grid"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/dist/recruiterDashboard.js"></script>
</body>
</html>
