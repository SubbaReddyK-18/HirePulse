<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HirePulse</title>
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/logo.svg">
</head>
<body data-page="login" data-access="guest">
  <header id="site-header"></header>
  <main>
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Access your HirePulse account to manage jobs and applications.</p>
      <div id="form-alert"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username">
        <p class="field-error" data-error-for="email"></p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <p class="field-error" data-error-for="password"></p>
        <button class="btn btn-primary" id="login-submit" type="submit">Login</button>
      </form>
      <p>Need an account? <a href="./register.html">Register</a></p>
      <p class="muted">Sample candidate: priya.sharma@gmail.com / password123<br>Sample recruiter: ananya@techverse.com / recruiter123</p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/dist/login.js"></script>
</body>
</html>
